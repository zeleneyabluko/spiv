<!doctype html>
<html lang="en">
  <head>
    <title>Spiv</title>
  </head>
  <body>
    <h1>Spiv.online</h1>
    <h3>Upload your *.musicxml file:</h3>

    <form id="uploadForm">
      <label for="musicxmlFile">Select *.musicxml file:</label>
      <input
        type="file"
        id="musicxmlFile"
        name="musicxmlFile"
        accept=".mxl, .musicxml, .xml"
      />
    </form>

    <div style="display: none; width: 800px;"><canvas id="soundFrequencyChart"></canvas></div>

    <div id="osmdContainer"></div>

    <script type="module" src="uploadFile.js"></script>
    <script type="module" src="index.js"></script>
    <script type="module" src="soundFrequencyChart.js"></script>
  </body>
</html>
