<!doctype html>
<html lang="en">
  <head>
    <title>Spiv</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: auto;
        min-height: 100vh;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
      }
      #soundFrequencyChart {
        width: 100%;
        height: 250px !important;
        min-height: 250px !important;
        max-height: 250px !important;
        order: 1;
      }
      #osmdContainer {
        order: 2;
        margin-top: 0 !important;
        padding-top: 0 !important;
        height: 300px !important;
        min-height: 300px !important;
        max-height: 300px !important;
        overflow-y: auto !important;
      }
      .chart-container {
        order: 1;
        margin-top: 40px;
        margin-bottom: 20px;
        height: 250px !important;
        min-height: 250px !important;
        max-height: 250px !important;
      }
      .notation-container {
        order: 2;
        margin-top: 0 !important;
        padding-top: 0 !important;
        height: 300px !important;
        min-height: 300px !important;
        max-height: 300px !important;
        overflow-y: auto !important;
        width: 800px;
        margin: 0 auto;
        transition: all 0.3s ease;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 10px;
        background-color: #f8f8f8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: none; /* Hide initially */
      }
      .notation-container.collapsed {
        height: 0 !important;
        min-height: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        margin: 0 auto;
        padding: 0 !important;
      }
      .notation-container.show {
        display: block; /* Show when file is uploaded */
      }
      #toggleNotation {
        transition: all 0.3s ease;
        display: none;
      }
      #toggleNotation.show {
        display: block;
      }
      #toggleNotation:hover {
        background-color: #6c757d;
        color: white;
      }
      #canvasWrapper {
        width: 800px;
        margin: 0 auto;
        overflow-x: hidden; /* Disable scrolling initially */
        white-space: nowrap;
        margin-bottom: 20px;
        transition: all 0.3s ease;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 10px;
        background-color: #f8f8f8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: none; /* Hide initially */
      }
      #canvasWrapper.show {
        display: block; /* Show when file is uploaded */
      }
      #canvasWrapper.scroll-enabled {
        overflow-x: auto; /* Enable scrolling when microphone access is granted */
      }
      #uploadForm {
        margin-bottom: 20px;
      }
      #transposeInput {
        display: none;
        margin-bottom: 20px;
      }
      #transposeInput.show {
        display: block;
      }
      h1, h3 {
        margin-bottom: 10px;
      }
      /* Override any OSMD styles */
      .osmd-container {
        margin-top: 0 !important;
        padding-top: 0 !important;
        height: 300px !important;
        min-height: 300px !important;
        max-height: 300px !important;
        overflow-y: auto !important;
      }
      .osmd-container svg {
        margin-top: 0 !important;
        padding-top: 0 !important;
      }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
  </head>
  <body class="box">
    <h1>Spiv.online</h1>
    <h3>Upload your *.musicxml file:</h3>

    <form id="uploadForm">
      <label for="musicxmlFile">Select *.musicxml file:</label>
      <input
        type="file"
        id="musicxmlFile"
        name="musicxmlFile"
        accept=".mxl, .musicxml, .xml"
      />
    </form>

    <div class="ui action input collapsibleContent" id="transposeInput">
      <input type="number" id="transpose" value="0">
      <button class="ui button" id="transpose-btn">Transpose (by semitones)</button>
    </div>


    <div id="canvasWrapper">
      <canvas id="chart" height="400"></canvas>
  </div>

    <div id="controlPanelContainer"></div>

    <div class="notation-section">
      <button id="toggleNotation" class="btn btn-secondary" style="margin-bottom: 10px; width: 800px; margin: 0 auto 10px auto;">
        Hide Music Sheet
      </button>
      <div class="notation-container">
        <div id="osmdContainer"></div>
      </div>
    </div>

    <script type="module" src="uploadFile.js"></script>
    <script type="module" src="index.js"></script> 
    <script type="module" src="soundFrequencyChart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
