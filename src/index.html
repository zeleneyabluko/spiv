<!doctype html>
<html lang="en">
  <head>
    <title>Spiv</title>
  </head>
  <body>
    <h1>Spiv.online</h1>
    <h3>Upload your *.musicxml file:</h3>

    <form id="uploadForm">
      <label for="musicxmlFile">Select *.musicxml file:</label>
      <input type="file" id="musicxmlFile" name="musicxmlFile" accept=".mxl, .musicxml"  />
      <button type="button" id="uploadButton">Upload</button>
  </form>


    <!-- <script type="module" src="dimensions.js"></script> -->
    <!--<script type="module" src="acquisitions.js"></script>-->
    <script>
      const input = document.getElementById('musicxmlFile');
      input.addEventListener('change', uploadFile);
      function uploadFile() {
        console.log('file uploading');
        const inputField = document.getElementById('musicxmlFile');
        const file = inputField.files[0];
        
        localStorage.setItem('name', file.toString());
         }
    </script>
    <!-- <div style="width: 500px;"><canvas id="dimensions"></canvas></div><br/> -->
    <div style="width: 800px;"><canvas id="acquisitions"></canvas></div>
  </body>
</html>
