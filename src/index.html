<!doctype html>
<html lang="en">
  <head>
    <title>Spiv</title>
    <style>
      #soundFrequencyChart {
        width: 100%;
        height: 400px;
        margin: 20px 0;
      }
    </style>
  </head>
  <body class="box">
    <h1>Spiv.online</h1>
    <h3>Upload your *.musicxml file:</h3>

    <form id="uploadForm">
      <label for="musicxmlFile">Select *.musicxml file:</label>
      <input
        type="file"
        id="musicxmlFile"
        name="musicxmlFile"
        accept=".mxl, .musicxml, .xml"
      />
    </form>

    <div class="row-content" id="soundFrequencyChart"></div>

    <div id="osmdContainer"></div>

    <script type="module" src="uploadFile.js"></script>
    <script type="module" src="index.js"></script>
    <script type="module" src="soundFrequencyChart.js"></script>
  </body>
</html>
